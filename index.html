<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <title>Системи рівнянь</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game d-flex flex-column align-items-center justify-content-center min-vh-100">

    <div id="welcome" class="text-center">
      <h1 class="game-title">Фруктові Обчислення 🍎</h1>
      <button id="generate-problem"
        onclick="handleGenerateProblemClick()"
        class="btn btn-lg btn-primary game-btn">Start the game ✨</button>
    </div>

    <div id="fruit-problem" class="text-center d-none">
      <ul id="fruit-equations" class="mb-3">
      </ul>
      <div id="fruit-control" class="d-flex flex-column align-items-center">
      </div>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="logic.js"></script>
</body>
</html>
